name: generate-knight-animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_knight.py"
      - ".github/workflows/knight.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate light + dark knight SVGs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/generate_knight.py --theme light --out dist/knight-light.svg
          python3 scripts/generate_knight.py --theme dark  --out dist/knight-dark.svg

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/knight-light.svg dist/knight-dark.svg
          git commit -m "chore: refresh knight animation [skip ci]" || echo "nothing to commit"
          git push origin HEAD:output --force
